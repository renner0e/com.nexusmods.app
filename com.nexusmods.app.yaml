app-id: com.nexusmods.app
runtime: org.freedesktop.Platform
runtime-version: '24.08'
sdk: org.freedesktop.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.dotnet9
command: NexusMods.App

build-options:
    # we don't really need the PATH thingies
    # as we don't do install.sh
    # see https://github.com/flathub/org.freedesktop.Sdk.Extension.dotnet9#publishing-self-contained-app-and-trimmed-binaries
    prepend-path: /usr/lib/sdk/dotnet9/bin
    append-ld-library-path: /usr/lib/sdk/dotnet9/lib
    prepend-pkg-config-path: /usr/lib/sdk/dotnet9/lib/pkgconfig
    arch:
      aarch64:
        env:
          RUNTIME: "linux-arm64"
      x86_64:
        env:
          RUNTIME: "linux-x64"

finish-args:
    # needed by device=input, otherwise device=all and remove this line
  - --require-version=1.16.0
  - --device=dri
  - --device=input # controller support
  - --share=ipc # for x11
  - --share=network
  - --socket=fallback-x11
  - --socket=wayland
  - --filesystem=~/.local/share/Steam:ro
  - --env=DOTNET_ROOT=/app/lib/dotnet

modules:
  - name: app
    buildsystem: simple
    build-options:
      env:
        DOTNET_CLI_TELEMETRY_OPTOUT: "true"
        DOTNET_SKIP_FIRST_TIME_EXPERIENCE: "true"
        DOTNET_NOLOGO: "true"

        # See https://nexus-mods.github.io/NexusMods.App/developers/Contributing/#for-package-maintainers
        INSTALLATION_METHOD_PACKAGE_MANAGER: "1"

    sources:
      - type: git
        url: https://github.com/Nexus-Mods/NexusMods.App
        tag:  v0.10.2
        commit: 8f2920c93ca3c0ad77b687ba036b86fc9d365fc9
        x-checker-data:
          type: git
          tag-pattern: "^v([\\d.]+)$"
          is-important: true

      # TODO: figure out a way to only download arm sources on arm arch etc.
      - nuget-sources.json
      #- nuget-sources.aarch64.json
      - nuget-sources.x86_64.json


    build-commands:
      - dotnet publish -p:FullRelease=True --source nuget-sources/ -c Release --runtime $RUNTIME --self-contained true

      - mkdir -p ${FLATPAK_DEST}/{bin,lib}
      - cp -r src/NexusMods.App/bin/Release/net9.0/$RUNTIME/publish/* ${FLATPAK_DEST}/bin

      # Use own build of 7zz as that supports RAR files
      # See https://nexus-mods.github.io/NexusMods.App/developers/Contributing/#for-package-maintainers
      - cp src/NexusMods.App/bin/Release/net9.0/$RUNTIME/runtimes/$RUNTIME/native/7zz ${FLATPAK_DEST}/bin

      - install -D src/NexusMods.App/icon.svg ${FLATPAK_DEST}/share/icons/hicolor/scalable/apps/${FLATPAK_ID}.svg
      - install -D src/NexusMods.App/${FLATPAK_ID}.metainfo.xml ${FLATPAK_DEST}/share/metainfo/${FLATPAK_ID}.metainfo.xml

      - install -D src/NexusMods.App/${FLATPAK_ID}.desktop ${FLATPAK_DEST}/share/applications/${FLATPAK_ID}.desktop
      - desktop-file-edit --set-key Exec --set-value "NexusMods.App %u" ${FLATPAK_DEST}/share/applications/${FLATPAK_ID}.desktop
      - desktop-file-edit --set-key TryExec --set-value "NexusMods.App" ${FLATPAK_DEST}/share/applications/${FLATPAK_ID}.desktop
      - desktop-file-edit --remove-key X-AppImage-Integrate ${FLATPAK_DEST}/share/applications/${FLATPAK_ID}.desktop
      - desktop-file-edit --remove-key X-AppImage-Name ${FLATPAK_DEST}/share/applications/${FLATPAK_ID}.desktop
      - desktop-file-edit --remove-key X-AppImage-Arch ${FLATPAK_DEST}/share/applications/${FLATPAK_ID}.desktop
