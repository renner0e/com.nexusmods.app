app-id: org.x.webapp-manager
runtime: org.gnome.Platform
runtime-version: "master" # runtimes needs python 3.13 for beautifulsoup4 to install, use gnome 49 when available, 48 doesn't work
sdk: org.gnome.Sdk
command: webapp-manager
finish-args:
  - --share=network
  - --share=ipc #X11
  - --socket=wayland
  - --socket=fallback-x11
  - --socket=pulseaudio

  # Systray
  - --talk-name=org.kde.StatusNotifierWatcher
  - --talk-name=com.canonical.AppMenu.Registrar
  - --talk-name=com.canonical.indicator.application
  - --talk-name=com.canonical.Unity

  # This sucks
  - --filesystem=/var/lib/flatpak:ro # system installed browsers
  - --filesystem=~/.local/share/flatpak:ro # user installed browsers
  - --filesystem=~/.var/app


  # list all the supported browsers in flatpaks here
  - --filesystem=~/.local/share/applications # could use the new portal like https://flathub.org/apps/net.codelogistics.webapps

  # https://github.com/linuxmint/webapp-manager/blob/master/usr/lib/webapp-manager/common.py#L182
#  - --filesystems=~/.var/app/net.waterfox.waterfox
#  - --filesystems=~/.var/app/org.mozilla.firefox
#  - --filesystems=~/.var/app/app.zen_browser.zen
#  - --filesystems=~/.var/app/com.brave.Browser
#  - --filesystems=~/.var/app/io.gitlab.librewolf-community

cleanup:
  - /include
  - /lib/pkgconfig/xapp.pc
  - /share/glade/catalogs/xapp-glade-catalog.xml

modules:
  - name: webapp-manager
    buildsystem: simple
    build-commands:
      - install -D usr/bin/webapp-manager ${FLATPAK_DEST}/bin/webapp-manager

      - install -D usr/lib/webapp-manager/common.py ${FLATPAK_DEST}/lib/webapp-manager/common.py
      - install -D usr/lib/webapp-manager/webapp-manager.py ${FLATPAK_DEST}/lib/webapp-manager/webapp-manager.py

      - install -D usr/share/applications/webapp-manager.desktop ${FLATPAK_DEST}/share/applications/${FLATPAK_ID}.desktop
      - desktop-file-edit --remove-key NotShowIn ${FLATPAK_DEST}/share/applications/${FLATPAK_ID}.desktop
      - desktop-file-edit --set-key Icon --set-value ${FLATPAK_ID} ${FLATPAK_DEST}/share/applications/${FLATPAK_ID}.desktop

      - install -D usr/share/icons/hicolor/scalable/apps/webapp-manager.svg ${FLATPAK_DEST}/share/icons/hicolor/scalable/apps/${FLATPAK_ID}.svg
      - install -D usr/share/icons/hicolor/scalable/categories/applications-webapps.svg ${FLATPAK_DEST}/share/icons/hicolor/scalable/categories/${FLATPAK_ID}.svg

      - install -D usr/share/glib-2.0/schemas/${FLATPAK_ID}.gschema.xml ${FLATPAK_DEST}/share/glib-2.0/schemas/${FLATPAK_ID}.gschema.xml
      - glib-compile-schemas ${FLATPAK_DEST}/share/glib-2.0/schemas

      - install -D usr/share/webapp-manager/shortcuts.ui ${FLATPAK_DEST}/share/webapp-manager/shortcuts.ui
      - install -D usr/share/webapp-manager/webapp-manager.ui ${FLATPAK_DEST}/share/webapp-manager/webapp-manager.ui

      - install -D usr/share/webapp-manager/firefox/userChrome-with-navbar.css ${FLATPAK_DEST}/share/webapp-manager/firefox/userChrome-with-navbar.css
      - install -D usr/share/webapp-manager/firefox/profile/places.sqlite ${FLATPAK_DEST}/share/webapp-manager/firefox/profile/places.sqlite
      - install -D usr/share/webapp-manager/firefox/profile/search.json.mozlz4 ${FLATPAK_DEST}/share/webapp-manager/firefox/profile/search.json.mozlz4
      - install -D usr/share/webapp-manager/firefox/profile/user.js ${FLATPAK_DEST}/share/webapp-manager/firefox/profile/user.js
      - install -D usr/share/webapp-manager/firefox/profile/chrome/userChrome.css ${FLATPAK_DEST}/share/webapp-manager/firefox/profile/chrome/userChrome.css

    sources:
      - type: git
        url: https://github.com/linuxmint/webapp-manager.git
        commit: ffa3ca5c7340a9ee3328cd3785fdaff92bef036b
        tag: "1.4.2"
        x-checker-data:
          type: git
          tag-pattern: ([\d.]+)$
          is-important: true

      - type: patch
        path: replace-usr-with-app.patch

    modules:
      - name: xapp
        buildsystem: meson
        config-opts:
          # https://github.com/linuxmint/xapp/blob/master/meson_options.txt
          - -Dapp-lib-only=true
          - -Dstatus-notifier=true
          - -Dpy-overrides-dir=/app/lib/python3.12/
          - -Dvapi=false
        sources:
          - type: git
            url: https://github.com/linuxmint/xapp.git
            commit: 0bd3683b180336e2aa94ab5c568f7bd24a97c856
            tag: "2.8.12"
            x-checker-data:
              type: anitya
              project-id: 382118

        modules:
          - name: python
          - python-deps.yaml

