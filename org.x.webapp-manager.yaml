app-id: org.x.webapp-manager
runtime: org.gnome.Platform
runtime-version: '48'
sdk: org.gnome.Sdk
command: webapp-manager
appstream-compose: false
finish-args:
  - --share=network
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11

modules:
  - name: webapp-manager
    buildsystem: simple
    build-commands:
      - install -D usr/bin/webapp-manager ${FLATPAK_DEST}/bin/webapp-manager

      - install -D usr/lib/webapp-manager/common.py ${FLATPAK_DEST}/lib/webapp-manager/common.py
      - install -D usr/lib/webapp-manager/webapp-manager.py ${FLATPAK_DEST}/lib/webapp-manager/webapp-manager.py

      - install -D usr/share/applications/webapp-manager.desktop ${FLATPAK_DEST}/share/applications/${FLATPAK_ID}.desktop
      - install -D usr/share/icons/hicolor/scalable/apps/webapp-manager.svg ${FLATPAK_DEST}/share/icons/hicolor/scalable/apps/${FLATPAK_ID}.svg
      - install -D usr/share/icons/hicolor/scalable/categories/applications-webapps.svg ${FLATPAK_DEST}/share/icons/hicolor/scalable/categories/${FLATPAK_ID}.svg
      - install -D usr/share/glib-2.0/schemas/${FLATPAK_ID}.gschema.xml ${FLATPAK_DEST}/share/metainfo/${FLATPAK_ID}.metainfo.xml

    sources:
      - type: git
        url: https://github.com/linuxmint/webapp-manager/
        commit: ffa3ca5c7340a9ee3328cd3785fdaff92bef036b
        tag: "1.4.2"
      - type: patch
        path: replace-usr-with-app.patch

    modules:
      - name: python-gobject
        buildsystem: simple
        build-commands:
          - pip3 install --verbose --exists-action=i --no-index --find-links="file://${PWD}"
            --prefix=${FLATPAK_DEST} --no-build-isolation pygobject

        sources:
          - type: file
            url: https://files.pythonhosted.org/packages/4a/36/fec530a313d3d48f12e112ac0a65ee3ccc87f385123a0493715609e8e99c/pygobject-3.52.3.tar.gz
            sha256: 00e427d291e957462a8fad659a9f9c8be776ff82a8b76bdf402f1eaeec086d82
            x-checker-data:
              type: pypi

          - type: file
            url: https://files.pythonhosted.org/packages/d8/e4/0c4c39e18fd76d6a628d4dd8da40543d136ce2d1752bd6eeeab0791f4d6b/beautifulsoup4-4.13.4.tar.gz
            sha256: dbb3c4e1ceae6aefebdaf2423247260cd062430a410e38c66f2baa50a8437195
            x-checker-data:
              type: pypi
              name: beautifulsoup4

          - type: file
            url: https://files.pythonhosted.org/packages/f3/0d/d0d6dea55cd152ce3d6767bb38a8fc10e33796ba4ba210cbab9354b6d238/pillow-11.3.0.tar.gz
            sha256: 3828ee7586cd0b2091b6209e5ad53e20d0649bbe87164a459d0676e035e8f523
            x-checker-data:
              type: pypi
              name: pillow

          - type: file
            url: https://files.pythonhosted.org/packages/f5/c4/c7f9e41bc2e5f8eeae4a08a01c91b2aea3dfab40a3e14b25e87e7db8d501/configobj-5.0.9.tar.gz
            sha256: 03c881bbf23aa07bccf1b837005975993c4ab4427ba57f959afdd9d1a2386848
            x-checker-data:
              type: pypi
              name: configobj

          - type: file
            url: https://files.pythonhosted.org/packages/9e/af/56efe21c53ac81ac87e000b15e60b3d8104224b4313b6eacac3597bd183d/setproctitle-1.3.6.tar.gz
            sha256: c9f32b96c700bb384f33f7cf07954bb609d35dd82752cef57fb2ee0968409169
            x-checker-data:
              type: pypi
              name: setproctitle

          - type: file
            url: https://files.pythonhosted.org/packages/97/78/182641ea38e3cfd56e9c7b3c0d48a53d432eea755003aa544af96403d4ac/tldextract-5.3.0.tar.gz
            sha256: b3d2b70a1594a0ecfa6967d57251527d58e00bb5a91a74387baa0d87a0678609
            x-checker-data:
              type: pypi
              name: tldextract

      - name: xapp
        buildsystem: meson
        config-opts:
          - -Ddeprecated_warnings=true
          - -Dapp-lib-only=true
          - -Dintrospection=true
          - -Dstatus-notifier=true
          - -Ddocs=false
          - -Dapp-lib-only=true
          - -Dpy-overrides-dir=/app/lib/python3.12/
        sources:
          - type: git
            url: https://github.com/linuxmint/xapp.git
            commit: 0bd3683b180336e2aa94ab5c568f7bd24a97c856
            tag: "2.8.12"
            x-checker-data:
              type: anitya
              project-id: 382118



