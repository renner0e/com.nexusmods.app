app-id: io.github.kavishdevar.Librepods
runtime: org.kde.Platform
runtime-version: "6.9"
sdk: org.kde.Sdk
command: applinux
finish-args:
  - --share=network
  - --share=ipc #X11
  - --socket=wayland
  - --socket=fallback-x11
  - --socket=pulseaudio
  - --system-talk-name=org.bluez.*
  - --talk-name=org.kde.StatusNotifierWatcher
  - --own-name=org.mpris.MediaPlayer2.*
  - --allow=bluetooth
  - --device=all


modules:
  - name: librepods
    buildsystem: cmake-ninja
    builddir: true
    subdir: linux
    config-opts:
      - -DCMAKE_BUILD_TYPE=Release
    sources:
      - type: git
        url: https://github.com/kavishdevar/librepods
        commit: e437572355d7390cd51dcd16ee5456ce8abf3cab
