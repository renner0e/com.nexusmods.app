app-id: io.github.kavishdevar.Librepods
runtime: org.kde.Platform
runtime-version: "6.9"
sdk: org.kde.Sdk
command: librepods
finish-args:
  - --share=network
  - --share=ipc #X11
  - --socket=wayland
  - --socket=fallback-x11
  - --socket=pulseaudio
  - --system-talk-name=org.bluez.*
  - --talk-name=org.kde.StatusNotifierWatcher
  - --own-name=org.mpris.MediaPlayer2.*
  - --allow=bluetooth
  - --device=all


modules:
  - name: librepods
    buildsystem: cmake-ninja
    builddir: true
    subdir: linux
    config-opts:
      - -DCMAKE_BUILD_TYPE=Release
    sources:
      - type: git
        url: https://github.com/kavishdevar/librepods
        commit: f062eb43b3be168d22d27ff3d5550c3ba9d277b0
    post-install:
      - mv /app/bin/applinux /app/bin/librepods

